[phases.build]
cmds = ["pip install -r backend/requirements.txt"]

[phases.start]
cmds = ["cd backend && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port ${PORT}"]

[variables]
PORT = "8000"
DATABASE_URL = "sqlite:////app/lodestar.db"
LLM_PROVIDER = "mock"
EMBEDDER = "auto"
LOG_LEVEL = "INFO"
