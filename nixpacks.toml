[phases.build]
cmds = ["pip install -r backend/requirements.txt"]

[phases.start]
cmds = ["cd backend && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"]

[phases.install]
cmds = ["python -m venv /opt/venv && . /opt/venv/bin/activate && pip install --upgrade pip"]

[variables]
PORT = "8000"
DATABASE_URL = "sqlite:////app/lodestar.db"
LLM_PROVIDER = "mock"
EMBEDDER = "auto"
LOG_LEVEL = "INFO"

[static]
# Download embedding model during build
build_cmds = [". /opt/venv/bin/activate && python -c 'from fastembed import TextEmbedding; TextEmbedding(model_name=\"BAAI/bge-small-en-v1.5\")'"]
